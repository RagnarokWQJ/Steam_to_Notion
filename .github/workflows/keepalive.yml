name: Repository Keepalive

on:
  schedule:
    - cron: "17 4 1 * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update keepalive branch
        shell: bash
        run: |
          set -euo pipefail
          branch="actions-keepalive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_ref" ]; then
            git fetch --depth=1 origin "refs/heads/$branch"
            git switch --force-create "$branch" FETCH_HEAD
          else
            # Keep activity commits out of the code history, including in forks.
            git switch --orphan "$branch"
          fi

          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push origin "HEAD:refs/heads/$branch"
