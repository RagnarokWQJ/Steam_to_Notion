name: Repository Keepalive

on:
  schedule:
    - cron: "17 4 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  enable_workflows:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep workflows enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed=0
          for workflow in steam-to-notion.yml keepalive.yml; do
            endpoint="repos/$GH_REPO/actions/workflows/$workflow"
            if ! state=$(gh api "$endpoint" --jq .state); then
              failed=1
              continue
            fi

            case "$state" in
              active|disabled_inactivity)
                if ! gh api --method PUT "$endpoint/enable"; then
                  failed=1
                fi
                ;;
              disabled_manually|disabled_fork)
                echo "Skipping $workflow: $state; enable it manually when needed."
                ;;
              *)
                echo "::error::Unexpected state for $workflow: $state"
                failed=1
                ;;
            esac
          done
          exit "$failed"

  keepalive_commit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Add an empty commit when needed
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          last_commit_seconds=$(git show -s --format=%ct HEAD)
          now_seconds=$(date +%s)
          elapsed_seconds=$((now_seconds - last_commit_seconds))
          if [ "$elapsed_seconds" -lt $((30 * 24 * 60 * 60)) ]; then
            echo "Latest default-branch commit is less than 30 days old; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          # A concurrent branch update should reject this push, never be overwritten.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
